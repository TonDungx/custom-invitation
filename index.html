<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<meta name="theme-color" content="#F7F4EE">
<title>Một lời mời</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root {
  --bg: #F7F4EE; --fg: #1C1917; --muted: #6B635A; --line: #DDD5C8; --accent: #8A6A3B;
  --display: "Cormorant Garamond", serif;
  --body: "Be Vietnam Pro", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .7, .1, 1);
  --ease-io: cubic-bezier(.77, 0, .18, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 300 1rem/1.75 var(--body);
  -webkit-font-smoothing: antialiased;
  opacity: 0; transition: opacity .6s var(--ease), background-color .4s, color .4s;
}
body.ready { opacity: 1; }
body.locked { overflow: hidden; }
::selection { background: var(--accent); color: var(--bg); }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

.wrap { width: min(100% - 3rem, 34rem); margin-inline: auto; }
section { padding-block: clamp(5rem, 16vh, 9rem); }
section + section { border-top: 1px solid var(--line); }

.eyebrow { font-size: .75rem; font-weight: 400; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
.display { font: 400 clamp(2.6rem, 10.5vw, 4.25rem)/1.08 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.italic { font-family: var(--display); font-style: italic; }
.rule { width: 3rem; height: 1px; background: var(--accent); margin-block: 2rem; transform-origin: left; }

/* Reveal: opacity + transform only (GPU, no layout). */
[data-r] { opacity: 0; transform: translateY(14px); transition: opacity 1s var(--ease), transform 1s var(--ease); transition-delay: calc(var(--d, 0) * 110ms); }
.rule[data-r] { transform: scaleX(0); }
.mask { display: block; overflow: hidden; padding-block: .14em; margin-block: -.14em; }
.mask > span { display: block; transform: translateY(110%); transition: transform 1.2s var(--ease); transition-delay: calc(var(--d, 0) * 110ms); }
.in[data-r], .in .mask > span, .mask.in > span { opacity: 1; transform: none; }

/* Cover */
.cover {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center;
  background: var(--bg); padding: 2rem;
  transition: transform 1.1s var(--ease-io);
}
.cover.out { transform: translateY(-100%); }
.cover.out .cover-in { opacity: 0; transform: translateY(-2rem); transition: opacity .5s, transform .8s var(--ease-io); }
.cover .rule { margin-inline: auto; transform-origin: center; }
.cover-in > * + * { margin-top: 1.25rem; }

/* Buttons */
.btn {
  position: relative; overflow: hidden; isolation: isolate;
  display: inline-flex; align-items: center; justify-content: center; gap: .75rem;
  min-height: 3.25rem; padding: 0 2.25rem; border: 1px solid var(--fg); border-radius: 0;
  background: transparent; color: var(--fg); cursor: pointer; text-decoration: none;
  font: 400 .75rem/1 var(--body); letter-spacing: .24em; text-transform: uppercase;
  transition: color .45s var(--ease);
}
.btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--fg); transform: scaleX(0); transform-origin: right; transition: transform .55s var(--ease); }
.btn:hover { color: var(--bg); }
.btn:hover::before { transform: scaleX(1); transform-origin: left; }
.btn:active { transform: scale(.98); }
.btn.solid { background: var(--fg); color: var(--bg); }
.btn.solid::before { background: var(--accent); }
.btn svg { width: 14px; height: 14px; }

/* Letter */
.letter .msg { margin-top: 2rem; white-space: pre-line; color: var(--muted); font-size: 1.05rem; }
.sign { margin-top: 2.5rem; font-size: 1.6rem; }

/* Date */
.when { text-align: center; }
.day { font: 400 clamp(6rem, 30vw, 9.5rem)/.9 var(--display); margin-top: 1.5rem; font-variant-numeric: lining-nums; }
.when .italic { font-size: 1.6rem; margin-top: 1rem; }
.when .rule { margin-inline: auto; transform-origin: center; }
.count { display: flex; justify-content: center; gap: clamp(1.25rem, 6vw, 2.5rem); }
.count div { display: grid; gap: .25rem; min-width: 3rem; }
.count b { font: 400 2rem/1 var(--display); font-variant-numeric: tabular-nums lining-nums; }
.count small { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

/* Itinerary */
.stops { list-style: none; position: relative; margin-top: 3rem; }
.stops::before {
  content: ""; position: absolute; left: 4.5rem; top: .9rem; bottom: .9rem; width: 1px; background: var(--line);
  transform: scaleY(0); transform-origin: top; transition: transform 1.8s var(--ease) .2s;
}
.stops.in::before { transform: none; }
.stop { display: grid; grid-template-columns: 4.5rem 1fr; padding-bottom: 3rem; }
.stop:last-child { padding-bottom: 0; }
.stop time { font: 400 1.15rem/1.9 var(--display); font-variant-numeric: tabular-nums lining-nums; color: var(--muted); }
.stop .body { position: relative; padding-left: 2rem; }
.stop .body::before {
  content: ""; position: absolute; left: -3.5px; top: .75rem; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 5px var(--bg);
}
.stop h3 { font: 400 1.85rem/1.25 var(--display); }
.stop p { color: var(--muted); margin-top: .25rem; }
.dir {
  display: inline-flex; align-items: center; gap: .5rem; margin-top: .75rem; min-height: 2.75rem;
  font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; text-decoration: none; color: var(--accent);
}
.dir svg { width: 14px; height: 14px; transition: transform .4s var(--ease); }
.dir:hover svg { transform: translateX(4px); }
.dir span { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .5s var(--ease); }
.dir:hover span { background-size: 100% 1px; }

/* RSVP: both states share one grid cell -> no layout jump. */
.rsvp { text-align: center; }
.stack { display: grid; margin-top: 2.5rem; }
.stack > * { grid-area: 1 / 1; transition: opacity .6s var(--ease), transform .8s var(--ease), visibility 0s; }
.stack .done { opacity: 0; visibility: hidden; transform: translateY(12px); transition-delay: 0s, 0s, .8s; }
.yes .stack .ask { opacity: 0; visibility: hidden; transform: translateY(-12px); transition-delay: 0s, 0s, .6s; }
.yes .stack .done { opacity: 1; visibility: visible; transform: none; transition-delay: .35s, .35s, 0s; }
.ring { width: 56px; height: 56px; margin: 0 auto 1.5rem; }
.ring circle { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 164; stroke-dashoffset: 164; transform: rotate(-90deg); transform-origin: center; }
.ring path { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 30; stroke-dashoffset: 30; }
.yes .ring circle { stroke-dashoffset: 0; transition: stroke-dashoffset 1.4s var(--ease) .5s; }
.yes .ring path { stroke-dashoffset: 0; transition: stroke-dashoffset .7s var(--ease) 1.5s; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 2rem; }

footer { padding-block: 3rem calc(3rem + env(safe-area-inset-bottom)); text-align: center; border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>
<script src="shared.js"></script>
</head>
<body class="locked">
<div class="cover" id="cover" hidden></div>
<main id="app"></main>

<script type="module">
const $ = s => document.querySelector(s);
const arrow = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h13M9 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
let opened = false, cfg, timer, io;

function render() {
  const d = new Date(cfg.date);
  const valid = !isNaN(d);
  const weekday = valid ? new Intl.DateTimeFormat('vi-VN', { weekday: 'long' }).format(d) : '';
  const pad = n => String(n).padStart(2, '0');
  const dateText = valid ? `${pad(d.getDate())} · ${pad(d.getMonth() + 1)} · ${d.getFullYear()}` : '';
  const timeText = valid ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
  const reply = safeUrl(cfg.reply);
  document.title = `Gửi ${cfg.to}`;

  $('#cover').innerHTML = `
    <div class="cover-in">
      <p class="eyebrow" data-r style="--d:1">Một lời mời dành cho</p>
      <h1 class="display"><span class="mask" data-r style="--d:2"><span>${esc(cfg.to)}</span></span></h1>
      <div class="rule" data-r style="--d:4"></div>
      <p class="eyebrow" data-r style="--d:5">${esc(dateText)}</p>
      <div data-r style="--d:6"><button class="btn" id="open" type="button">Mở thư</button></div>
    </div>`;

  $('#app').innerHTML = `
    <section class="letter"><div class="wrap">
      <p class="eyebrow" data-r>Gửi ${esc(cfg.to)},</p>
      <h2 class="display" style="margin-top:1.5rem"><span class="mask" data-r style="--d:1"><span>${esc(cfg.title)}</span></span></h2>
      <div class="rule" data-r style="--d:3"></div>
      <p class="msg" data-r style="--d:4">${esc(cfg.message)}</p>
      <p class="sign italic" data-r style="--d:5">— ${esc(cfg.from)}</p>
    </div></section>

    ${valid ? `<section class="when"><div class="wrap">
      <p class="eyebrow" data-r>Thời gian</p>
      <p class="day" data-r style="--d:1">${pad(d.getDate())}</p>
      <p class="eyebrow" data-r style="--d:2">Tháng ${d.getMonth() + 1} · ${d.getFullYear()}</p>
      <p class="italic" data-r style="--d:3">${esc(weekday)}, ${timeText}</p>
      <div class="rule" data-r style="--d:4"></div>
      <div class="count" id="count" data-r style="--d:5" aria-label="Thời gian còn lại">
        ${['Ngày', 'Giờ', 'Phút', 'Giây'].map(l => `<div><b>00</b><small>${l}</small></div>`).join('')}
      </div>
    </div></section>` : ''}

    ${cfg.stops?.length ? `<section><div class="wrap">
      <p class="eyebrow" data-r>Lịch trình</p>
      <ol class="stops" data-r>
        ${cfg.stops.map((s, i) => {
          const m = mapUrl(s.address);
          return `<li class="stop" data-r style="--d:${i + 1}">
            <time>${esc(s.time)}</time>
            <div class="body">
              <h3>${esc(s.name)}</h3>
              ${s.note ? `<p>${esc(s.note)}</p>` : ''}
              ${m ? `<a class="dir" href="${esc(m)}" target="_blank" rel="noopener"><span>Chỉ đường</span>${arrow}</a>` : ''}
            </div>
          </li>`;
        }).join('')}
      </ol>
    </div></section>` : ''}

    <section class="rsvp" id="rsvp"><div class="wrap">
      <h2 class="display"><span class="mask" data-r><span>${esc(cfg.ask)}</span></span></h2>
      <div class="stack">
        <div class="ask" data-r style="--d:2"><button class="btn solid" id="yes" type="button">${esc(cfg.accept)}</button></div>
        <div class="done" aria-live="polite">
          <svg class="ring" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26"/><path d="M20 28.5l5.5 5.5L37 22.5"/></svg>
          <p class="italic" style="font-size:1.75rem">${esc(cfg.thanks)}</p>
          <div class="actions">
            ${valid ? `<button class="btn" id="ics" type="button">Thêm vào lịch</button>` : ''}
            ${reply ? `<a class="btn" href="${esc(reply)}" target="_blank" rel="noopener">${esc(cfg.replyLabel)}</a>` : ''}
          </div>
        </div>
      </div>
    </div></section>

    <footer><p class="eyebrow">${esc(cfg.from)} &amp; ${esc(cfg.to)}</p></footer>`;

  $('#yes').onclick = () => $('#rsvp').classList.add('yes');
  $('#ics')?.addEventListener('click', () => downloadIcs(d));
  $('#open').onclick = openCover;

  clearInterval(timer);
  if (valid) {
    const cells = [...document.querySelectorAll('#count b')];
    const tick = () => {
      const s = Math.max(0, (d - Date.now()) / 1000 | 0);
      if (!s) { $('#count').hidden = true; return clearInterval(timer); }
      [s / 86400 | 0, s % 86400 / 3600 | 0, s % 3600 / 60 | 0, s % 60].forEach((v, i) => cells[i].textContent = String(v).padStart(2, '0'));
    };
    tick(); timer = setInterval(tick, 1000);
  }
}

function reveal(root, instant) {
  const els = root.querySelectorAll('[data-r]');
  if (instant) return els.forEach(e => e.classList.add('in'));
  io ??= new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { rootMargin: '0px 0px -12% 0px' });
  els.forEach(e => io.observe(e));
}

function openCover() {
  opened = true;
  const c = $('#cover');
  c.classList.add('out');
  document.body.classList.remove('locked');
  setTimeout(() => reveal($('#app')), 350);
  c.addEventListener('transitionend', e => { if (e.target === c) c.hidden = true; }, { once: true });
}

function downloadIcs(d) {
  const f = x => `${x.getFullYear()}${String(x.getMonth() + 1).padStart(2, '0')}${String(x.getDate()).padStart(2, '0')}T${String(x.getHours()).padStart(2, '0')}${String(x.getMinutes()).padStart(2, '0')}00`;
  const t = s => String(s ?? '').replace(/[\\,;]/g, '\\$&').replace(/\n/g, '\\n');
  const end = new Date(+d + 4 * 3600e3);
  const s0 = cfg.stops?.[0] || {};
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//invite//vi', 'BEGIN:VEVENT',
    `UID:${+d}@invite`, `DTSTAMP:${f(new Date())}`, `DTSTART:${f(d)}`, `DTEND:${f(end)}`,
    `SUMMARY:${t(`Hẹn hò cùng ${cfg.from}`)}`,
    `LOCATION:${t([s0.name, /^https?:/i.test(s0.address) ? '' : s0.address].filter(Boolean).join(' - '))}`,
    `DESCRIPTION:${t((cfg.stops || []).map(s => `${s.time} ${s.name}`).join('\n'))}`,
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })), download: 'hen-ho.ics' });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function boot(first) {
  cfg = await readHash();
  await Promise.race([applyStyle(cfg), new Promise(r => setTimeout(r, 1500))]);
  render();
  const c = $('#cover');
  if (cfg.intro && !opened) {
    c.hidden = false; c.classList.remove('out');
    document.body.classList.add('locked');
    requestAnimationFrame(() => requestAnimationFrame(() => reveal(c, false)));
  } else {
    c.hidden = true; document.body.classList.remove('locked');
    reveal($('#app'), !first); // live edits from admin: no re-animation
  }
  document.body.classList.add('ready');
}

boot(true);
addEventListener('hashchange', () => boot(false));
</script>
</body>
</html>
