<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<meta name="theme-color" content="#F7F4EE">
<title>Một lời mời</title>
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root {
  --bg: #F7F4EE; --fg: #1C1917; --muted: #6B635A; --line: #DDD5C8; --accent: #8A6A3B;
  --display: "Cormorant Garamond", serif;
  --body: "Be Vietnam Pro", system-ui, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1); /* expo-out: quick start, long soft settle */
  --ease-io: cubic-bezier(.77, 0, .18, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 300 1rem/1.75 var(--body);
  -webkit-font-smoothing: antialiased;
  opacity: 0; transition: opacity .6s var(--ease), background-color .4s, color .4s;
}
body.ready { opacity: 1; }
body.locked { overflow: hidden; }
::selection { background: var(--accent); color: var(--bg); }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

.wrap { width: min(100% - 3rem, 34rem); margin-inline: auto; }
section { padding-block: clamp(5rem, 16vh, 9rem); }
section + section { border-top: 1px solid var(--line); }

.eyebrow { font-size: .75rem; font-weight: 400; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
.display { font: 400 clamp(2.6rem, 10.5vw, 4.25rem)/1.08 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.italic { font-family: var(--display); font-style: italic; }
.rule { width: 3rem; height: 1px; background: var(--accent); margin-block: 2rem; transform-origin: left; }

/* Reveal: opacity + transform only (GPU, no layout). */
[data-r] { opacity: 0; transform: translateY(18px); transition: opacity 1.2s var(--ease), transform 1.4s var(--ease); transition-delay: calc(var(--d, 0) * 120ms); }
.rule[data-r] { transform: scaleX(0); transition-duration: 1.2s, 1.6s; }
.in[data-r] { opacity: 1; transform: none; }

/* Headlines: each word sharpens out of a soft blur and settles, staggered.
   No clipping mask -> multi-line titles and Vietnamese diacritics never get cut mid-reveal. */
.words[data-r] { opacity: 1; transform: none; }
.words .w {
  display: inline-block; opacity: 0; filter: blur(12px); transform: translateY(.3em);
  transition: opacity 1.1s var(--ease), filter 1.2s var(--ease), transform 1.5s var(--ease);
  transition-delay: calc(var(--d, 0) * 120ms + var(--i) * 70ms);
}
.words.in .w { opacity: 1; filter: blur(0); transform: none; }

/* Cover: dissolves (content recedes + blurs) while the letter rises beneath. */
.cover {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center;
  background: var(--bg); padding: 2rem;
  transition: opacity 1.1s var(--ease) .15s, visibility 0s 1.3s;
}
.cover.out { opacity: 0; visibility: hidden; pointer-events: none; }
/* Exit uses an even curve (not expo-out) so the fade is visible rather than an instant cut. */
.cover-in { --out: cubic-bezier(.4, 0, .2, 1); transition: opacity .9s var(--out), transform 1.3s var(--out), filter 1s var(--out); }
.cover.out .cover-in { opacity: 0; transform: scale(.96) translateY(-1rem); filter: blur(8px); }
.cover .rule { margin-inline: auto; transform-origin: center; }
.cover-in > * + * { margin-top: 1.25rem; }

/* Buttons */
.btn {
  position: relative; overflow: hidden; isolation: isolate;
  display: inline-flex; align-items: center; justify-content: center; gap: .75rem;
  min-height: 3.25rem; padding: 0 2.25rem; border: 1px solid var(--fg); border-radius: 0;
  background: transparent; color: var(--fg); cursor: pointer; text-decoration: none;
  font: 400 .75rem/1 var(--body); letter-spacing: .24em; text-transform: uppercase;
  transition: color .45s var(--ease);
}
.btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--fg); transform: scaleX(0); transform-origin: right; transition: transform .55s var(--ease); }
.btn:hover { color: var(--bg); }
.btn:hover::before { transform: scaleX(1); transform-origin: left; }
.btn:active { transform: scale(.98); }
.btn.solid { background: var(--fg); color: var(--bg); }
.btn.solid::before { background: var(--accent); }
.btn svg { width: 14px; height: 14px; }

/* Background photo: fixed layer (no background-attachment: fixed -> no iOS jank).
   ::before = photo (+blur), ::after = theme-colour veil for legibility. Cover reuses the same layers. */
.backdrop { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; display: none; }
.has-bg .backdrop { display: block; }
.has-bg .backdrop::before, .has-bg .cover::before {
  content: ""; position: absolute; inset: calc(var(--blur, 0px) * -2); z-index: -2;
  background: var(--bg-img, none) center / cover no-repeat; filter: blur(var(--blur, 0px));
  transform: scale(1.08); opacity: 0; transition: transform 2.6s var(--ease), opacity 1.2s var(--ease);
}
.has-bg .backdrop::after, .has-bg .cover::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--bg); opacity: var(--dim, .7); }
.ready .backdrop::before, .ready .cover::before { transform: none; opacity: 1; }
.has-bg .cover { background: transparent; isolation: isolate; overflow: hidden; }
.has-bg section + section, .has-bg footer { border-color: color-mix(in srgb, var(--fg) 12%, transparent); }

/* Scroll cues: progress hairline (native scroll-driven, no JS) + "scroll" hint */
.progress { position: fixed; inset: 0 0 auto; z-index: 5; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; }
@supports (animation-timeline: scroll()) { .progress { animation: grow linear both; animation-timeline: scroll(root); } }
@keyframes grow { to { transform: scaleX(1); } }
.cue {
  position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom)); z-index: 5;
  display: grid; justify-items: center; gap: .75rem; min-width: 44px; padding: .5rem 1rem;
  background: none; border: 0; cursor: pointer; color: var(--muted);
  font: 400 .7rem/1 var(--body); letter-spacing: .28em; text-transform: uppercase;
  opacity: 0; visibility: hidden; transform: translate(-50%, 8px);
  transition: opacity .6s var(--ease), transform .6s var(--ease), visibility 0s .6s;
}
.cue.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }
.cue i { position: relative; width: 1px; height: 2.75rem; background: var(--line); overflow: hidden; }
.cue i::after { content: ""; position: absolute; inset: 0; background: var(--fg); transform: translateY(-100%); animation: drip 2s var(--ease-io) infinite; }
@keyframes drip { 50% { transform: none; } to { transform: translateY(100%); } }
.cue:hover { color: var(--fg); }

/* Letter */
.letter { min-height: 100svh; display: grid; align-content: center; }
.letter .msg { margin-top: 2rem; white-space: pre-line; color: var(--muted); font-size: 1.05rem; }
.sign { margin-top: 2.5rem; font-size: 1.6rem; }

/* Date */
.when { text-align: center; }
.day { font: 400 clamp(6rem, 30vw, 9.5rem)/.9 var(--display); margin-top: 1.5rem; font-variant-numeric: lining-nums; }
.when .italic { font-size: 1.6rem; margin-top: 1rem; }
.when .rule { margin-inline: auto; transform-origin: center; }
.count { display: flex; justify-content: center; gap: clamp(1.25rem, 6vw, 2.5rem); }
.count div { display: grid; gap: .25rem; min-width: 3rem; }
.count b { font: 400 2rem/1 var(--display); font-variant-numeric: tabular-nums lining-nums; }
.count small { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

/* Itinerary */
.stops { list-style: none; position: relative; margin-top: 3rem; }
.stops::before {
  content: ""; position: absolute; left: 4.5rem; top: .9rem; bottom: .9rem; width: 1px; background: var(--line);
  transform: scaleY(0); transform-origin: top; transition: transform 1.8s var(--ease) .2s;
}
.stops.in::before { transform: none; }
.stop { display: grid; grid-template-columns: 4.5rem 1fr; padding-bottom: 3rem; }
.stop:last-child { padding-bottom: 0; }
.stop time { font: 400 1.15rem/1.9 var(--display); font-variant-numeric: tabular-nums lining-nums; color: var(--muted); }
.stop .body { position: relative; padding-left: 2rem; }
.stop .body::before {
  content: ""; position: absolute; left: -3.5px; top: .75rem; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 5px var(--bg);
}
.stop h3 { font: 400 1.85rem/1.25 var(--display); }
.stop p { color: var(--muted); margin-top: .25rem; }
.links { display: flex; gap: .5rem; margin-top: 1rem; }
.links a {
  position: relative; display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 50%;
  border: 1px solid var(--line); color: var(--fg); isolation: isolate; overflow: hidden;
  transition: color .35s var(--ease), border-color .35s var(--ease);
}
.links a::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%; background: var(--fg); transform: scale(0); transition: transform .45s var(--ease); }
.links a:hover { color: var(--bg); border-color: var(--fg); }
.links a:hover::before { transform: scale(1); }
.links svg { width: 18px; height: 18px; }

/* RSVP: both states share one grid cell -> no layout jump. */
.rsvp { text-align: center; }
.stack { display: grid; margin-top: 2.5rem; }
.stack > * { grid-area: 1 / 1; transition: opacity .6s var(--ease), transform .8s var(--ease), visibility 0s; }
.stack .done { opacity: 0; visibility: hidden; transform: translateY(12px); transition-delay: 0s, 0s, .8s; }
.yes .stack .ask { opacity: 0; visibility: hidden; transform: translateY(-12px); transition-delay: 0s, 0s, .6s; }
.yes .stack .done { opacity: 1; visibility: visible; transform: none; transition-delay: .35s, .35s, 0s; }
.ask { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .75rem; }
.btn.ghost { border-color: var(--line); color: var(--muted); }
#no { --heat: 0; color: color-mix(in srgb, var(--accent) calc(var(--heat) * 100%), var(--muted)); border-color: color-mix(in srgb, var(--accent) calc(var(--heat) * 100%), var(--line));
  transition: transform .6s cubic-bezier(.3, 1.35, .5, 1), color .3s, border-color .3s; }
#no::before { content: none; } /* no hover fill: keeps the "heating up" colour visible */
/* Particles for the decline button (smoke / dust). Gradient instead of filter: cheap to composite. */
.fx { position: fixed; z-index: 20; pointer-events: none; border-radius: 50%; }
.fx.smoke { background: radial-gradient(circle, color-mix(in srgb, var(--fg) 38%, transparent), transparent 68%); }
.fx.dust { background: var(--fg); }
.ring { width: 56px; height: 56px; margin: 0 auto 1.5rem; }
.ring circle { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 164; stroke-dashoffset: 164; transform: rotate(-90deg); transform-origin: center; }
.ring path { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 30; stroke-dashoffset: 30; }
.yes .ring circle { stroke-dashoffset: 0; transition: stroke-dashoffset 1.4s var(--ease) .5s; }
.yes .ring path { stroke-dashoffset: 0; transition: stroke-dashoffset .7s var(--ease) 1.5s; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 2rem; }

footer { padding-block: 3rem calc(3rem + env(safe-area-inset-bottom)); text-align: center; border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; transition-delay: 0s !important; }
  .cue i::after { animation: none; transform: none; }
}
</style>
<script src="shared.js"></script>
</head>
<body class="locked">
<div class="cover" id="cover" hidden></div>
<div class="backdrop" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"></div>
<main id="app"></main>
<button class="cue" id="cue" type="button">Cuộn xuống<i aria-hidden="true"></i></button>

<script type="module">
const $ = s => document.querySelector(s);
// Monoline icons, one stroke weight, so they read as a set.
const svg = p => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  map: svg('<path d="M12 21s-6.5-5.8-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 15.2 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/>'),
  fb: svg('<path d="M14.5 21v-7.5h2.6l.4-3h-3V8.7c0-.9.3-1.5 1.6-1.5h1.6V4.5a20 20 0 0 0-2.4-.1c-2.4 0-4 1.4-4 4.1v2h-2.6v3h2.6V21"/>'),
  ig: svg('<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/>'),
};
let opened = false, cfg, timer, io;
// "Một buổi tối" -> <span class="w" style="--i:0">Một</span> <span class="w" style="--i:1">buổi</span> ...
let wi;
const words = s => (wi = 0, String(s ?? '').split(/(\s+)/).map(t => /^\s*$/.test(t) ? t : `<span class="w" style="--i:${wi++}">${esc(t)}</span>`).join(''));

function render() {
  const d = new Date(cfg.date);
  const valid = !isNaN(d);
  const weekday = valid ? new Intl.DateTimeFormat('vi-VN', { weekday: 'long' }).format(d) : '';
  const pad = n => String(n).padStart(2, '0');
  const dateText = valid ? `${pad(d.getDate())} · ${pad(d.getMonth() + 1)} · ${d.getFullYear()}` : '';
  const timeText = valid ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
  const reply = safeUrl(cfg.reply);
  document.title = `Gửi ${cfg.to}`;

  $('#cover').innerHTML = `
    <div class="cover-in">
      <p class="eyebrow" data-r style="--d:1">Một lời mời dành cho</p>
      <h1 class="display words" data-r style="--d:2">${words(cfg.to)}</h1>
      <div class="rule" data-r style="--d:4"></div>
      <p class="eyebrow" data-r style="--d:5">${esc(dateText)}</p>
      <div data-r style="--d:6"><button class="btn" id="open" type="button">Mở thư</button></div>
    </div>`;

  $('#app').innerHTML = `
    <section class="letter"><div class="wrap">
      <p class="eyebrow" data-r>Gửi ${esc(cfg.to)},</p>
      <h2 class="display words" data-r style="margin-top:1.5rem;--d:1">${words(cfg.title)}</h2>
      <div class="rule" data-r style="--d:3"></div>
      <p class="msg" data-r style="--d:4">${esc(cfg.message)}</p>
      <p class="sign italic" data-r style="--d:5">— ${esc(cfg.from)}</p>
    </div></section>

    ${valid ? `<section class="when"><div class="wrap">
      <p class="eyebrow" data-r>Thời gian</p>
      <p class="day" data-r style="--d:1">${pad(d.getDate())}</p>
      <p class="eyebrow" data-r style="--d:2">Tháng ${d.getMonth() + 1} · ${d.getFullYear()}</p>
      <p class="italic" data-r style="--d:3">${esc(weekday)}, ${timeText}</p>
      <div class="rule" data-r style="--d:4"></div>
      <div class="count" id="count" data-r style="--d:5" aria-label="Thời gian còn lại">
        ${['Ngày', 'Giờ', 'Phút', 'Giây'].map(l => `<div><b>00</b><small>${l}</small></div>`).join('')}
      </div>
    </div></section>` : ''}

    ${cfg.stops?.length ? `<section><div class="wrap">
      <p class="eyebrow" data-r>Lịch trình</p>
      <ol class="stops" data-r>
        ${cfg.stops.map((s, i) => {
          const links = [['Google Maps', mapUrl(s.address), ICONS.map], ['Facebook', fbUrl(s.facebook), ICONS.fb], ['Instagram', igUrl(s.instagram), ICONS.ig]]
            .filter(l => l[1]);
          return `<li class="stop" data-r style="--d:${i + 1}">
            <time>${esc(s.time)}</time>
            <div class="body">
              <h3>${esc(s.name)}</h3>
              ${s.note ? `<p>${esc(s.note)}</p>` : ''}
              ${links.length ? `<div class="links">${links.map(([n, u, svg]) =>
                `<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${n}: ${esc(s.name)}" title="${n}">${svg}</a>`).join('')}</div>` : ''}
            </div>
          </li>`;
        }).join('')}
      </ol>
    </div></section>` : ''}

    <section class="rsvp" id="rsvp"><div class="wrap">
      <h2 class="display words" data-r>${words(cfg.ask)}</h2>
      <div class="stack">
        <div class="ask" data-r style="--d:2">
          <button class="btn solid" id="yes" type="button">${esc(cfg.accept)}</button>
          ${cfg.declineMode !== 'off' && cfg.decline ? `<button class="btn ghost" id="no" type="button">${esc(cfg.decline)}</button>` : ''}
        </div>
        <div class="done" aria-live="polite">
          <svg class="ring" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26"/><path d="M20 28.5l5.5 5.5L37 22.5"/></svg>
          <p class="italic" style="font-size:1.75rem">${esc(cfg.thanks)}</p>
          <div class="actions">
            ${valid ? `<button class="btn" id="ics" type="button">Thêm vào lịch</button>` : ''}
            ${reply ? `<a class="btn" href="${esc(reply)}" target="_blank" rel="noopener">${esc(cfg.replyLabel)}</a>` : ''}
          </div>
        </div>
      </div>
    </div></section>

    <footer><p class="eyebrow">${esc(cfg.from)} &amp; ${esc(cfg.to)}</p></footer>`;

  $('#yes').onclick = () => $('#rsvp').classList.add('yes');
  setupDecline();
  $('#ics')?.addEventListener('click', () => downloadIcs(d));
  $('#open').onclick = openCover;

  clearInterval(timer);
  if (valid) {
    const cells = [...document.querySelectorAll('#count b')];
    const tick = () => {
      const s = Math.max(0, (d - Date.now()) / 1000 | 0);
      if (!s) { $('#count').hidden = true; return clearInterval(timer); }
      [s / 86400 | 0, s % 86400 / 3600 | 0, s % 3600 / 60 | 0, s % 60].forEach((v, i) => cells[i].textContent = String(v).padStart(2, '0'));
    };
    tick(); timer = setInterval(tick, 1000);
  }
}

// ---- Decline button: it can never actually be pressed. ----
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function particles(el, count, kind) {
  if (calm()) return;
  const r = el.getBoundingClientRect(), smoke = kind === 'smoke';
  for (let i = 0; i < count; i++) {
    const p = document.createElement('i'), size = smoke ? 18 + Math.random() * 28 : 2 + Math.random() * 3;
    p.className = 'fx ' + kind;
    Object.assign(p.style, { width: size + 'px', height: size + 'px',
      left: r.left + Math.random() * r.width - size / 2 + 'px', top: r.top + r.height * (smoke ? .35 : Math.random()) - size / 2 + 'px' });
    document.body.append(p);
    const dx = (Math.random() - .5) * (smoke ? 90 : 70), dy = -(40 + Math.random() * (smoke ? 130 : 100));
    p.animate([
      { transform: 'translate(0,0) scale(.4)', opacity: smoke ? .6 : .9 },
      { transform: `translate(${dx}px,${dy}px) scale(${smoke ? 2.4 : 1})`, opacity: 0 },
    ], { duration: 900 + Math.random() * 1000, delay: Math.random() * 160, easing: 'cubic-bezier(.2,.7,.1,1)', fill: 'backwards' })
      .onfinish = () => p.remove();
  }
}

// Remove the button; the accept button glides to centre (View Transitions where supported).
function removeNo(no) {
  const done = () => no.remove();
  document.startViewTransition && !calm() ? document.startViewTransition(done) : done();
}

function setupDecline() {
  const no = $('#no');
  if (!no) return;

  if (cfg.declineMode === 'dodge') {
    let tx = 0, ty = 0;
    const flee = e => {
      e?.preventDefault();
      const sec = $('#rsvp').getBoundingClientRect(), r = no.getBoundingClientRect();
      const ox = r.left - tx, oy = r.top - ty, m = 16; // untransformed position
      const avoid = [$('#yes'), $('#rsvp h2')].map(el => el.getBoundingClientRect());
      const minX = Math.max(sec.left, 0) + m, maxX = Math.min(sec.right, innerWidth) - r.width - m;
      const minY = Math.max(sec.top, 0) + m, maxY = Math.min(sec.bottom, innerHeight) - r.height - m;
      for (let i = 0; i < 40; i++) {
        const x = minX + Math.random() * Math.max(0, maxX - minX), y = minY + Math.random() * Math.max(0, maxY - minY);
        const hit = avoid.some(a => x < a.right + m && x + r.width > a.left - m && y < a.bottom + m && y + r.height > a.top - m);
        if (!hit && Math.hypot(x - r.left, y - r.top) > 110) {
          tx = x - ox; ty = y - oy;
          no.style.transform = `translate(${tx}px, ${ty}px)`;
          return;
        }
      }
    };
    no.addEventListener('pointerenter', e => e.pointerType === 'mouse' && flee());
    no.addEventListener('pointerdown', flee); // touch: jumps before the tap lands
    no.addEventListener('click', flee);       // keyboard
    return;
  }

  if (cfg.declineMode === 'smoke') {
    let n = 0;
    no.onclick = () => {
      n++;
      no.style.setProperty('--heat', Math.min(1, n / 3));
      no.animate([0, -4, 4, -3, 3, 0].map((x, i) => ({ transform: `translateX(${x}px) rotate(${i % 2 ? -1.5 : 1.5}deg)` })), { duration: 380 });
      particles(no, 3 + n * 4, 'smoke');
      if (n >= 4) {
        no.disabled = true;
        particles(no, 26, 'smoke');
        no.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px) scale(.9)', filter: 'blur(6px)' }],
          { duration: 900, delay: 250, easing: 'ease-out', fill: 'forwards' }).onfinish = () => removeNo(no);
      }
    };
    return;
  }

  if (cfg.declineMode === 'vanish') {
    no.onclick = () => {
      no.disabled = true;
      particles(no, 46, 'dust');
      no.animate([
        { opacity: 1, filter: 'blur(0)', transform: 'none', letterSpacing: '.24em' },
        { opacity: 0, filter: 'blur(10px)', transform: 'translateY(-16px) scale(1.04)', letterSpacing: '.6em' },
      ], { duration: 1100, easing: 'cubic-bezier(.2,.7,.1,1)', fill: 'forwards' }).onfinish = () => removeNo(no);
    };
  }
}

function reveal(root, instant) {
  const els = root.querySelectorAll('[data-r]');
  if (instant) return els.forEach(e => e.classList.add('in'));
  io ??= new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { rootMargin: '0px 0px -12% 0px' });
  els.forEach(e => io.observe(e));
}

// Scroll cue: visible only at the very top of a page that still has content below.
// Derived from scroll position every time, so it can never get stuck on (e.g. over the footer).
let cueOn = false;
const syncCue = () => $('#cue').classList.toggle('show',
  cueOn && scrollY < 40 && document.documentElement.scrollHeight > innerHeight + 40);
addEventListener('scroll', syncCue, { passive: true });
function showCue() { setTimeout(() => { cueOn = true; syncCue(); }, 1400); }
$('#cue').onclick = () => $('#app section:nth-of-type(2)')?.scrollIntoView({ behavior: 'smooth' });

function openCover() {
  opened = true;
  const c = $('#cover');
  c.classList.add('out');
  document.body.classList.remove('locked');
  setTimeout(() => reveal($('#app')), 200); // overlap with the cover fade: no empty beat
  showCue();
  c.addEventListener('transitionend', e => { if (e.target === c) c.hidden = true; }, { once: true });
}

function downloadIcs(d) {
  const f = x => `${x.getFullYear()}${String(x.getMonth() + 1).padStart(2, '0')}${String(x.getDate()).padStart(2, '0')}T${String(x.getHours()).padStart(2, '0')}${String(x.getMinutes()).padStart(2, '0')}00`;
  const t = s => String(s ?? '').replace(/[\\,;]/g, '\\$&').replace(/\n/g, '\\n');
  const end = new Date(+d + 4 * 3600e3);
  const s0 = cfg.stops?.[0] || {};
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//invite//vi', 'BEGIN:VEVENT',
    `UID:${+d}@invite`, `DTSTAMP:${f(new Date())}`, `DTSTART:${f(d)}`, `DTEND:${f(end)}`,
    `SUMMARY:${t(`Hẹn hò cùng ${cfg.from}`)}`,
    `LOCATION:${t([s0.name, /^https?:/i.test(s0.address) ? '' : s0.address].filter(Boolean).join(' - '))}`,
    `DESCRIPTION:${t((cfg.stops || []).map(s => `${s.time} ${s.name}`).join('\n'))}`,
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })), download: 'hen-ho.ics' });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function boot(first) {
  cfg = await readConfig('config.json');
  await Promise.race([applyStyle(cfg), new Promise(r => setTimeout(r, 1500))]);
  render();
  const c = $('#cover');
  if (cfg.intro && !opened) {
    c.hidden = false; c.classList.remove('out');
    document.body.classList.add('locked');
    requestAnimationFrame(() => requestAnimationFrame(() => reveal(c, false)));
  } else {
    c.hidden = true; document.body.classList.remove('locked');
    reveal($('#app'), !first); // live edits from admin: no re-animation
    if (first) showCue();
  }
  document.body.classList.add('ready');
}

boot(true);
addEventListener('hashchange', () => boot(false));
</script>
